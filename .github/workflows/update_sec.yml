name: Daily SEC Ticker Update

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run the action manually from the GitHub UI

permissions:
  contents: write

jobs:
  update-sec-list:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run SEC Download Script
      run: python download_sec.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add sec_list/SEC_List.json
        # Only commit and push if there are actual changes
        git diff --staged --quiet || git commit -m "Auto-update SEC ticker list"
        git push